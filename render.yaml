services:
  # ── Backend (Flask) ────────────────────────────────────────────────────────
  - type: web
    name: smart-attendance-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FRONTEND_URL
        value: https://smart-attendance-frontend.onrender.com  # update to match your frontend service name
      - key: PYTHON_VERSION
        value: "3.11"

  # ── Frontend (React/Vite Static Site) ─────────────────────────────────────
  - type: web
    name: smart-attendance-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://smart-attendance-backend.onrender.com  # update to match your backend service name
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
