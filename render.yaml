databases:
  # ── Managed PostgreSQL ──────────────────────────────────────────────────────
  - name: smart-attendance-db
    databaseName: attendance_db
    user: attendance_user
    plan: free                  # upgrade to 'starter' or higher for persistent storage

services:
  # ── Backend (Flask + Docker) ───────────────────────────────────────────────
  - type: web
    name: smart-attendance-backend
    runtime: docker             # uses Dockerfile in backend/
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-attendance-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://smart-attendance-frontend.onrender.com
      - key: PORT
        value: 10000

  # ── Frontend (React/Vite Static Site) ─────────────────────────────────────
  - type: web
    name: smart-attendance-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://smart-attendance-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

